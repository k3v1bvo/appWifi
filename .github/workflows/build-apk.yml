name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK via Gradle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
          cache-disabled: true

      - name: Build Debug APK
        shell: bash
        run: |
          set -eo pipefail
          gradle :app:assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Output Build Log to Summary
        if: always()
        shell: bash
        run: |
          echo "### 📋 Build Log (Last 120 lines)" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          tail -n 120 build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Print Error Log in Console
        if: failure()
        shell: bash
        run: |
          echo "==== COMPILATION ERRORS ===="
          grep -E "e: |CompilationErrorException|Unresolved reference" build.log || true
          echo "==== GRADLE ERROR SNIPPET ===="
          tail -n 80 build.log

      - name: Upload Full Build Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-build-log
          path: build.log
          retention-days: 7

      - name: Collect Generated APK
        if: success()
        shell: bash
        run: |
          mkdir -p apk_output
          find . -type f -name "*.apk" -exec cp -v {} apk_output/ \;
          ls -la apk_output/

      - name: Upload Debug APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SmartWifiDataSaver-Debug-APK
          path: apk_output/*.apk
          if-no-files-found: error
          retention-days: 14
